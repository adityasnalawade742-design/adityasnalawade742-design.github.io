<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cozy Room Finds | Pinterest Affiliate Showcase</title>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;700&family=Playfair+Display:ital,wght@0,600;1,400&display=swap" rel="stylesheet">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: 'Outfit', sans-serif;
            background: #0f0e13;
            color: #f8f9fa;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 40px 20px;
            background-image: radial-gradient(circle at 50% 10%, rgba(251, 133, 0, 0.15), transparent 60%);
        }
        h1 {
            font-family: 'Playfair Display', serif;
            font-size: 36px;
            margin-bottom: 8px;
            color: #fff;
            text-align: center;
        }
        p.subtitle {
            color: #ffb703;
            font-size: 14px;
            letter-spacing: 2px;
            text-transform: uppercase;
            margin-bottom: 40px;
            text-align: center;
        }
        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 24px;
            max-width: 1000px;
            width: 100%;
        }
        .card {
            background: rgba(26, 24, 33, 0.85);
            border: 1px solid rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(16px);
            border-radius: 20px;
            padding: 16px;
            text-decoration: none;
            color: inherit;
            transition: transform 0.2s, box-shadow 0.2s;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .card:hover {
            transform: translateY(-4px);
            box-shadow: 0 12px 30px rgba(251, 133, 0, 0.3);
        }
        .card img {
            width: 100%;
            border-radius: 12px;
            aspect-ratio: 3/4;
            object-fit: cover;
            margin-bottom: 14px;
        }
        .card h2 {
            font-size: 16px;
            color: #fff;
            text-align: center;
            margin-bottom: 8px;
        }
        .card .price {
            color: #ffb703;
            font-weight: 700;
            font-size: 18px;
        }
    </style>
</head>
<body>
    <h1>Cozy Room Finds</h1>
    <p class="subtitle">✨ Curated Pinterest Home Decor & Smart Gadgets</p>

    <div class="grid">
        <a class="card" href="./bridge_B0D8P8CSYP.html">
            <img src="./focus_product_B0D8P8CSYP_hook.jpg" alt="Bird Touch Lamp">
            <h2>2Pack Small Cute Bird Table Lamp</h2>
            <div class="price">$20.56</div>
        </a>
    </div>
</body>
</html>
