<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cozy Room Finds | Pinterest Affiliate Showcase</title>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;700&family=Playfair+Display:ital,wght@0,600;1,400&display=swap" rel="stylesheet">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: 'Outfit', sans-serif;
            background: #0f0e13;
            color: #f8f9fa;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 40px 20px;
            background-image: radial-gradient(circle at 50% 10%, rgba(251, 133, 0, 0.15), transparent 60%);
        }
        .header {
            position: relative;
            width: 100%;
            max-width: 1000px;
            display: flex;
            flex-direction: column;
            align-items: center;
            margin-bottom: 40px;
        }
        h1 {
            font-family: 'Playfair Display', serif;
            font-size: 36px;
            margin-bottom: 8px;
            color: #fff;
            text-align: center;
        }
        p.subtitle {
            color: #ffb703;
            font-size: 14px;
            letter-spacing: 2px;
            text-transform: uppercase;
            text-align: center;
        }
        .admin-toggle-btn {
            display: none; /* Hidden from public visitors by default */
            margin-top: 16px;
            background: rgba(239, 68, 68, 0.15);
            border: 1px solid #ef4444;
            color: #f87171;
            padding: 6px 14px;
            border-radius: 20px;
            font-size: 12px;
            cursor: pointer;
            transition: all 0.2s;
        }
        body.is-admin .admin-toggle-btn {
            display: inline-block;
        }
        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 24px;
            max-width: 1000px;
            width: 100%;
        }
        .card-wrapper {
            position: relative;
            display: flex;
            flex-direction: column;
        }
        .card {
            background: rgba(26, 24, 33, 0.85);
            border: 1px solid rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(16px);
            border-radius: 20px;
            padding: 16px;
            text-decoration: none;
            color: inherit;
            transition: transform 0.2s, box-shadow 0.2s;
            display: flex;
            flex-direction: column;
            align-items: center;
            height: 100%;
        }
        .card:hover {
            transform: translateY(-4px);
            box-shadow: 0 12px 30px rgba(251, 133, 0, 0.3);
        }
        .card img {
            width: 100%;
            border-radius: 12px;
            aspect-ratio: 3/4;
            object-fit: cover;
            margin-bottom: 14px;
        }
        .card h2 {
            font-size: 16px;
            color: #fff;
            text-align: center;
            margin-bottom: 8px;
        }
        .card .price {
            color: #ffb703;
            font-weight: 700;
            font-size: 18px;
        }
        .delete-btn {
            display: none;
            margin-top: 10px;
            background: #ef4444;
            color: #fff;
            border: none;
            padding: 8px 16px;
            border-radius: 12px;
            font-weight: 600;
            font-size: 13px;
            cursor: pointer;
            transition: background 0.2s;
            text-align: center;
            width: 100%;
        }
        .delete-btn:hover {
            background: #dc2626;
        }
        body.is-admin .delete-btn {
            display: block;
        }
    </style>
</head>
<body>
    <div class="header">
        <h1>Cozy Room Finds</h1>
        <p class="subtitle">✨ Curated Pinterest Home Decor & Smart Gadgets</p>
        <button id="adminBtn" class="admin-toggle-btn" onclick="exitAdminMode()">🔐 Admin Mode Active (Click to Exit)</button>
    </div>

    <div class="grid" id="productGrid">
        <div class="card-wrapper" id="card-B0BZXNSW5K">
            <a class="card" href="./bridge_B0BZXNSW5K.html">
                <img src="./focus_product_B0BZXNSW5K_hook.jpg?v=2" alt="Fenmzee Bedside Table Lamp for Bedroom - Dimmable Touch, USB A+C, AC Outlet | 3-Way Dimmable, LED Bulb Included, Fabric Lampshade, Wood-Grain Metal Base, 14" Small Nightstand Lamp for Desk, Living Room">
                <h2>Fenmzee Bedside Table Lamp for Bedroom - Dimm...</h2>
                <div class="price">$19.99</div>
            </a>
            <button class="delete-btn" onclick="deleteCard('B0BZXNSW5K', 'card-B0BZXNSW5K')">🗑️ Delete Product</button>
        </div>

        <div class="card-wrapper" id="card-B0DXKGL1T2">
            <a class="card" href="./bridge_B0DXKGL1T2.html">
                <img src="./focus_product_B0DXKGL1T2_hook.jpg?v=2" alt="Flower Table Lamp Green">
                <h2>Flower Table Lamp Green, 5 Lily of The Valley</h2>
                <div class="price">£36.38</div>
            </a>
            <button class="delete-btn" onclick="deleteCard('B0DXKGL1T2', 'card-B0DXKGL1T2')">🗑️ Delete Product</button>
        </div>

        <div class="card-wrapper" id="card-B0D1FRDFFX">
            <a class="card" href="./bridge_B0D1FRDFFX.html">
                <img src="./focus_product_B0D1FRDFFX_hook.jpg?v=2" alt="Mushroom Touch Lamp">
                <h2>Dawnwake Mushroom Touch Table Lamp</h2>
                <div class="price">$39.98</div>
            </a>
            <button class="delete-btn" onclick="deleteCard('B0D1FRDFFX', 'card-B0D1FRDFFX')">🗑️ Delete Product</button>
        </div>

        <div class="card-wrapper" id="card-B0D8P8CSYP">
            <a class="card" href="./bridge_B0D8P8CSYP.html">
                <img src="./focus_product_B0D8P8CSYP_hook.jpg?v=2" alt="Bird Touch Lamp">
                <h2>2Pack Small Cute Bird Table Lamp</h2>
                <div class="price">$20.56</div>
            </a>
            <button class="delete-btn" onclick="deleteCard('B0D8P8CSYP', 'card-B0D8P8CSYP')">🗑️ Delete Product</button>
        </div>
    </div>

    <script>
        // Secret Admin Activation: Only activates if URL has ?admin=true or admin session is stored
        const urlParams = new URLSearchParams(window.location.search);
        const isAdminRequested = urlParams.get('admin') === 'true';

        if (isAdminRequested) {
            sessionStorage.setItem('is_admin_session', 'true');
        }

        if (sessionStorage.getItem('is_admin_session') === 'true') {
            document.body.classList.add('is-admin');
        }

        function exitAdminMode() {
            sessionStorage.removeItem('is_admin_session');
            document.body.classList.remove('is-admin');
            window.location.href = window.location.pathname; // Reload as public visitor
        }

        function deleteCard(asin, elementId) {
            if (confirm(`Are you sure you want to delete product ${asin} from the homepage?`)) {
                const el = document.getElementById(elementId);
                if (el) el.remove();
                
                // Store deleted ASINs in local storage
                let deleted = JSON.parse(localStorage.getItem('deleted_asins') || '[]');
                if (!deleted.includes(asin)) deleted.push(asin);
                localStorage.setItem('deleted_asins', JSON.stringify(deleted));

                alert(`Product ${asin} removed from view!\n\nTo purge permanently from GitHub repo, run:\npython delete_product.py ${asin}`);
            }
        }

        // Hide deleted items saved in localStorage
        const deleted = JSON.parse(localStorage.getItem('deleted_asins') || '[]');
        deleted.forEach(asin => {
            const el = document.getElementById(`card-${asin}`);
            if (el) el.remove();
        });
    </script>
</body>
</html>
